name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Project and Fix Gradle Configuration
        run: |
          # 1. حفظ كود التحكم الرئيسي
          cp lib/main.dart main.dart.bak

          # 2. تنظيف البيئة والتأكد من إزالة المجلدات القديمة
          rm -rf android ios pubspec.yaml pubspec.lock .dart_tool

          # 3. إعادة إنشاء هيكل أندرويد بأسماء حزم مسموحة
          flutter create --project-name receiver_app --platforms=android --org com.receiver.app .

          # 4. استرجاع الكود المباشر وإضافة مكتبة الضغط Zlib
          cp main.dart.bak lib/main.dart
          flutter pub add archive

          # 5. استبدال السطر بالكامل بتركيب Kotlin المعتمد (minSdk = 21)
          find android -name "build.gradle*" -exec sed -i 's/.*minSdk.*/        minSdk = 21/g' {} + || true

      - name: Build Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
