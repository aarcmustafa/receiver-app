name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Project and Fix Dart Imports
        run: |
          # 1. حفظ كود التحكم الرئيسي
          cp lib/main.dart main.dart.bak

          # 2. تنظيف المستودع من الملفات والاختبارات القديمة
          rm -rf android ios pubspec.yaml pubspec.lock .dart_tool test

          # 3. إعادة إنشاء هيكل المشروع
          flutter create --project-name receiver_app --platforms=android --org com.receiver.app .

          # 4. إزالة مجلد الاختبارات التلقائي لتجنب تعارض widget_test.dart
          rm -rf test

          # 5. استرجاع الكود والتأكد من إدراج مكتبة Uint8List في بداية الملف
          cp main.dart.bak lib/main.dart
          if ! grep -q "import 'dart:typed_data';" lib/main.dart; then
            sed -i '1i import '\''dart:typed_data'\'';' lib/main.dart
          fi

          # 6. إضافة مكتبة الضغط Zlib وتعديل minSdk إلى 21
          flutter pub add archive
          find android -name "build.gradle*" -exec sed -i 's/.*minSdk.*/        minSdk = 21/g' {} + || true

      - name: Build Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
