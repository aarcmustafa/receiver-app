name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project and Fix Android SDK
        run: |
          # 1. حفظ كود main.dart الأساسي
          cp lib/main.dart main.dart.bak
          
          # 2. إنشاء هيكل مشروع أندرويد حديث
          flutter create --platforms=android --org com.receiver.app .
          
          # 3. إرجاع كود التحكم بالرسيفر
          cp main.dart.bak lib/main.dart
          
          # 4. رفع الحد الأدنى للـ Android SDK إلى 21 لدعم الاتصالات
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Build Debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
