name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Fresh Android Project
        run: |
          # 1. حفظ كود التحكم الرئيسي
          cp lib/main.dart main.dart.bak
          
          # 2. إزالة أي ملفات إعدادات قديمة مسببة للتعارض
          rm -rf android pubspec.yaml
          
          # 3. إنشاء هيكل مشروع أندرويد ونظام حزم جديدين ونظيفين
          flutter create --platforms=android --org com.receiver.app .
          
          # 4. إرجاع كود main.dart وإضافة مكتبة الضغط تلقائياً
          cp main.dart.bak lib/main.dart
          flutter pub add archive

      - name: Build Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
