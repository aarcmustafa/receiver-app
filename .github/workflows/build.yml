name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Debug APK
        run: |
          # 1. إنشاء مشروع Flutter نقي في مجلد مؤقت
          flutter create --platforms=android temp_app
          
          # 2. إضافة مكتبة archive لدعم بروتوكول Zlib الخاصة بالرسيفر
          cd temp_app
          flutter pub add archive
          
          # 3. نسخ كود التحكم الرئيسي إلى المشروع
          cp ../lib/main.dart lib/main.dart
          
          # 4. رفع مستوى SDK ليتوافق مع شبكات TCP
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          
          # 5. بناء الملف النهائي
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
          
