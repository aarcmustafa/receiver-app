name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Project and Fix Gradle Configuration
        run: |
          # 1. حفظ كود التحكم بالرسيفر الرئيسي
          cp lib/main.dart main.dart.bak

          # 2. تنظيف المستودع من الملفات والإعدادات القديمة لتفادي أي تعارض
          rm -rf android ios pubspec.yaml pubspec.lock .dart_tool

          # 3. إنشاء هيكل مشروع أندرويد متكامل ونظيف
          flutter create --platforms=android --org com.receiver.app .

          # 4. إرجاع كود main.dart وإضافة مكتبة archive للتعامل مع Zlib
          cp main.dart.bak lib/main.dart
          flutter pub add archive

          # 5. ضبط minSdkVersion تلقائياً لكل صيغ build.gradle و build.gradle.kts
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion.*/minSdkVersion = 21/g' {} + || true

      - name: Build Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
